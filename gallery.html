<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chrysalis photo archive — Denver DIY.">
  <meta name="theme-color" content="#090909">
  <title>CHRYSALIS — PHOTO GALLERY</title>
  <script>
    try {
      const savedTheme = localStorage.getItem("chrysalis-theme");
      document.documentElement.dataset.theme =
        savedTheme === "light" ? "light" : "dark";
    } catch (error) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <link rel="stylesheet" href="styles.css?v=14">
</head>

<body class="gallery-page">
  <header class="site-header">
    <a
      class="logo-effect nav-logo"
      href="index.html"
      style="--logo: url('assets/chrysalislogo.svg');"
      aria-label="Chrysalis home"
    >
      <img
        src="assets/chrysalislogo.svg"
        alt=""
        class="logo-image"
      >
    </a>

    <nav class="site-nav" aria-label="Gallery navigation">
      <a href="index.html">home</a>
      <a href="index.html#calendar">calendar</a>
      <a href="index.html#events">upcoming</a>
      <a href="index.html#booking">booking</a>
      <a href="index.html#about">about</a>
    </nav>
    <button
      class="theme-toggle"
      id="themeToggle"
      type="button"
      aria-label="Switch to light mode"
    >[DARK] / LIGHT</button>
  </header>

  <main class="gallery-main">
    <section class="gallery-hero">
      <span class="section-number">ARCHIVE</span>
      <h1>Photo<br>gallery</h1>
      <p>Shows, art, people, and whatever else made it into the camera roll.</p>
    </section>

    <div class="chain-break" aria-hidden="true">
      <div class="chain-track">
        <img src="assets/chain.gif" alt="">
        <img src="assets/chain.gif" alt="">
        <img src="assets/chain.gif" alt="">
        <img src="assets/chain.gif" alt="">
        <img src="assets/chain.gif" alt="">
        <img src="assets/chain.gif" alt="">
      </div>
    </div>

    <section class="gallery-archive-section">
      <div id="galleryGrid" class="gallery-grid" aria-live="polite"></div>
      <p id="galleryStatus" class="tiny-status"></p>
    </section>
  </main>

  <footer class="site-footer">
    <span>CHRYSALIS / DENVER DIY</span>
    <a href="index.html">back home</a>
    <span id="year"></span>
  </footer>

  <dialog id="galleryDialog" class="photo-dialog">
    <button id="galleryClose" class="dialog-close" type="button" aria-label="Close photo">×</button>

    <button id="galleryPrev" class="photo-nav photo-nav-prev" type="button" aria-label="Previous photo">←</button>

    <figure>
      <img id="galleryDialogImage" src="" alt="">
    </figure>

    <button id="galleryNext" class="photo-nav photo-nav-next" type="button" aria-label="Next photo">→</button>
  </dialog>

  <script src="theme.js?v=1"></script>
  <script src="config.js?v=12"></script>
  <script src="gallery.js?v=11"></script>
</body>
</html>
