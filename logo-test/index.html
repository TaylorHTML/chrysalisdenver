<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Chrysalis Logo Test</title>
<style>
:root,html[data-theme="dark"]{--paper:#090909;--ink:#f3f3ed;--muted:#aaa9a2;--green:#19d600;--blue:#7ea4ff}
html[data-theme="light"]{--paper:#fff;--ink:#101010;--muted:#696965}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Courier New",monospace;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-28%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 16% 20%,rgba(25,214,0,.14),transparent 29%),radial-gradient(circle at 80% 26%,rgba(70,105,255,.14),transparent 33%),radial-gradient(circle at 50% 82%,rgba(160,80,255,.11),transparent 31%);animation:bg 22s ease-in-out infinite alternate}
html[data-theme="light"] body:before{background:radial-gradient(circle at 16% 20%,rgba(25,214,0,.10),transparent 29%),radial-gradient(circle at 80% 26%,rgba(70,105,255,.09),transparent 33%),radial-gradient(circle at 50% 82%,rgba(160,80,255,.07),transparent 31%)}
@keyframes bg{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,3%,0) scale(1.04)}}
header{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px max(16px,calc((100vw - 1100px)/2));border-bottom:1px solid rgba(128,128,128,.28);background:color-mix(in srgb,var(--paper) 66%,transparent);backdrop-filter:blur(14px);z-index:10}
header a,.toggle{font:12px "Courier New",monospace;color:var(--ink);background:none;border:0;text-decoration:underline;cursor:pointer}
main{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:112px 0 70px}
.kicker{margin:0 0 26px;color:var(--muted);font-size:11px;letter-spacing:.08em}
.stage{min-height:62vh;display:grid;place-items:center}
.logo-wrap{position:relative;width:min(980px,94vw);aspect-ratio:1000/529;display:grid;place-items:center;overflow:hidden}
.logo-base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;filter:invert(1)}
html[data-theme="light"] .logo-base{filter:none}
.logo-glow{position:absolute;inset:0;background:radial-gradient(circle,rgba(155,135,255,.42) 0%,rgba(100,135,255,.30) 25%,rgba(78,195,98,.23) 47%,rgba(78,195,98,0) 72%);background-size:58% 185%;background-repeat:no-repeat;-webkit-mask-image:url("chrysalis-logo-mask.svg");mask-image:url("chrysalis-logo-mask.svg");-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;animation:glow 11s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%{background-position:-38% 55%}20%{background-position:25% 18%}45%{background-position:108% 45%}70%{background-position:55% 82%}100%{background-position:-38% 55%}}
.note{max-width:760px;margin:36px auto 0;color:var(--muted);font-size:12px;line-height:1.7;text-align:center}
@media(max-width:650px){main{padding-top:96px}.stage{min-height:52vh}.logo-wrap{width:96vw}}
</style>
</head>
<body>
<header><a href="/">← chrysalisdenver.com</a><button class="toggle" id="toggle" type="button">[DARK] / LIGHT</button></header>
<main>
<p class="kicker">CHRYSALIS / LOGO TEST / SHELL REMOVED</p>
<section class="stage"><div class="logo-wrap" role="img" aria-label="Chrysalis"><img class="logo-base" src="chrysalis-logo-mask.svg" alt=""><div class="logo-glow" aria-hidden="true"></div></div></section>
<p class="note">This test uses the hand-drawn logo as a transparency mask. The shell on the far right has been removed. The black/white base color and the subtle moving color light are generated entirely with CSS.</p>
</main>
<script>
const root=document.documentElement,t=document.querySelector("#toggle");
t.addEventListener("click",()=>{const next=root.dataset.theme==="dark"?"light":"dark";root.dataset.theme=next;t.textContent=next==="dark"?"[DARK] / LIGHT":"DARK / [LIGHT]"});
</script>
</body>
</html>
